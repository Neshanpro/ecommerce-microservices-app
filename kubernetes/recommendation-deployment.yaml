apiVersion: v1
kind: ServiceAccount
metadata:
  name: recommendation
  namespace: ecommerce

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: recommendation
  namespace: ecommerce
  labels:
    app: recommendation
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: recommendation
  template:
    metadata:
      labels:
        app: recommendation
        version: v1
    spec:
      serviceAccountName: recommendation
      containers:
      - name: recommendation
        image: neshandoc/recommendation:365f674fa58943ca774b00a8fd035ec15d18e4b0
        imagePullPolicy: IfNotPresent
        ports:
        - name: grpc
          containerPort: 9001
          protocol: TCP
        env:
        - name: RECOMMENDATION_PORT
          value: "9001"
        - name: OTEL_SERVICE_NAME
          value: "recommendation"
        - name: PRODUCT_CATALOG_ADDR
          value: "product-catalog:3550"
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          tcpSocket:
            port: 9001
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          tcpSocket:
            port: 9001
          initialDelaySeconds: 5
          periodSeconds: 5
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL

---
apiVersion: v1
kind: Service
metadata:
  name: recommendation
  namespace: ecommerce
  labels:
    app: recommendation
spec:
  type: ClusterIP
  ports:
  - name: grpc
    port: 9001
    targetPort: 9001
    protocol: TCP
  selector:
    app: recommendation
